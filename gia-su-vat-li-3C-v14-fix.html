(function(){
  const PHYSICS_KNOWLEDGE = `
KIẾN THỨC NỀN — CHƯƠNG TRÌNH VẬT LÍ THPT (LỚP 10-11-12)
(Dùng làm căn cứ chuyên môn khi gợi ý. KHÔNG đọc nguyên văn cho học sinh — chỉ dùng để hiểu đúng bản chất, chọn đúng công thức, và nhận diện lỗi sai thường gặp của từng chuyên đề. Lưu ý: một số chuyên đề được sắp xếp ở lớp khác nhau tùy chương trình 2006 hay 2018 và tùy bộ sách, nhưng bản chất vật lí không đổi — nếu học sinh học theo thứ tự khác, vẫn dùng đúng phần kiến thức tương ứng.)

============ CÔNG CỤ TOÁN HỌC LIÊN THÔNG VỚI VẬT LÍ ============
(Vật lí THPT không tách rời Toán — khi gợi ý, hãy chủ động chỉ ra công cụ toán học đang dùng để học sinh thấy được sự liên kết.)

[A. VECTOR & LƯỢNG GIÁC]
- Lực, vận tốc, gia tốc, động lượng, cường độ điện trường... là đại lượng vector: cộng/trừ bằng quy tắc hình bình hành, hoặc chiếu lên 2 trục vuông góc Ox, Oy rồi cộng đại số từng thành phần.
- Ví dụ: vật trên mặt phẳng nghiêng góc α — trọng lực P được chiếu thành P·sinα (dọc mặt phẳng, kéo vật trượt) và P·cosα (vuông góc mặt phẳng, cân bằng với phản lực N). Kỹ năng lượng giác này dùng xuyên suốt phần Động lực học.

[B. ĐƯỜNG TRÒN LƯỢNG GIÁC & DAO ĐỘNG ĐIỀU HÒA]
- x = A·cos(ωt+φ) tương ứng với hình chiếu của một điểm chuyển động tròn đều (bán kính A, tốc độ góc ω) lên trục Ox. Đây là công cụ giải nhanh các bài tìm thời gian/quãng đường trong dao động mà không cần giải phương trình lượng giác trực tiếp — chuyển bài toán vật lí thành bài toán tính góc quét trên đường tròn, t = (góc quét)/ω.

[C. ĐẠO HÀM (liên hệ x — v — a)]
- v = dx/dt (vận tốc là đạo hàm của li độ/tọa độ theo thời gian); a = dv/dt (gia tốc là đạo hàm của vận tốc). Đây là lý do từ x=A·cos(ωt+φ) suy ra v=−Aω·sin(ωt+φ) và a=−Aω²·cos(ωt+φ)=−ω²x — không cần học thuộc máy móc, chỉ cần biết đạo hàm của hàm cos/sin.

[D. HỆ PHƯƠNG TRÌNH BẬC NHẤT]
- Nhiều bài (va chạm: bảo toàn động lượng + bảo toàn động năng; mạch điện hỗn hợp; chuyển động gặp nhau...) dẫn đến hệ 2 phương trình 2 ẩn, giải bằng phương pháp thế hoặc cộng đại số — hoàn toàn giống Toán đại số lớp 9-10.

[E. ĐỒ THỊ HÀM SỐ]
- Đồ thị x-t của chuyển động thẳng đều là đường thẳng (hàm bậc nhất); chuyển động biến đổi đều là parabol (hàm bậc hai). Quỹ đạo ném xiên (bỏ qua sức cản) có phương trình dạng y=ax²+bx thu được bằng cách khử t từ 2 phương trình thành phần — ứng dụng trực tiếp phương pháp khử ẩn trong Toán học.

[F. LOGARIT & HÀM MŨ]
- Mức cường độ âm L(dB)=10·log(I/I0) và định luật phóng xạ N=N0·2^(−t/T) (viết lại dạng mũ cơ số e: N=N0·e^(−λt) với λ=ln2/T) đều dùng logarit/hàm mũ — cùng công cụ với chương "Hàm số mũ và Logarit" ở Toán 11-12.

============ CÁCH DÙNG KIẾN THỨC NỀN NÀY ĐỂ GỢI Ý TRỰC QUAN, KHÔNG CHỈ LÍ THUYẾT SUÔNG ============
- Với mỗi chuyên đề dưới đây, TRƯỚC KHI nêu công thức, hãy giúp học sinh hình dung một tình huống cụ thể, đời thường (xe đang phanh gấp, đèn pin chiếu qua ly nước, hai xe va chạm, quả bóng nảy trên bàn...) rồi mới gắn công thức vào đúng tình huống đó. Tránh liệt kê công thức khô khan ngay từ câu đầu.
- Khuyến khích học sinh tự vẽ hình ra giấy (sơ đồ lực, đồ thị x-t/v-t, giản đồ vector, đường đi tia sáng...) như một bước gợi ý trong quá trình CORE, thay vì chỉ mô tả bằng lời.
- Khi chuyên đề phù hợp, có thể gợi ý mô phỏng PhET tại https://phet.colorado.edu/vi/simulations/filter?subjects=physics&type=html — vào trang rồi gõ từ khoá TIẾNG ANH sau vào ô tìm kiếm của chính trang đó (không tự bịa đường link con cụ thể):
  • Động học, rơi tự do, ném xiên → "projectile motion"
  • Lực, ma sát, mặt phẳng nghiêng → "forces and motion basics", "ramp forces and motion"
  • Dao động cơ, con lắc, lò xo → "pendulum lab", "masses and springs"
  • Sóng cơ, giao thoa, sóng dừng → "wave on a string", "waves intro"
  • Điện trường, tụ điện → "charges and fields", "capacitor lab basics"
  • Dòng điện không đổi, mạch điện → "circuit construction kit dc"
  • Từ trường, cảm ứng điện từ → "faradays law", "magnets and electromagnets"
  • Quang hình học, khúc xạ, thấu kính (ôn lại kiến thức lớp 9, không thuộc trọng tâm chương trình THPT hiện hành) → "bending light", "geometric optics"
  • Lượng tử ánh sáng, hiệu ứng quang điện → "photoelectric effect"
  • Vật lí hạt nhân, phóng xạ → "alpha decay", "beta decay"
  Chỉ nhắc mô phỏng khi thực sự liên quan đến đúng câu hỏi học sinh đang hỏi, không chèn vào mọi câu trả lời cho có.
- Nếu học sinh cần thêm đề luyện tập ngoài phần CONSOLIDATE tự tạo, có thể nhắc học sinh tìm thêm theo tên chuyên đề trên loigiaihay.com hoặc vietjack.com — không dẫn đường link cụ thể tới từng bài vì không xác minh được link còn tồn tại hay không.

============ LỚP 10 (Kết Nối Tri Thức) ============

[1. MỞ ĐẦU — PHÉP ĐO VÀ SAI SỐ]
- Phép đo trực tiếp (đo thẳng bằng dụng cụ) và phép đo gián tiếp (tính qua công thức từ các đại lượng đo trực tiếp).
- Sai số hệ thống (do dụng cụ/phương pháp, luôn lệch theo 1 chiều) và sai số ngẫu nhiên (do yếu tố khách quan, ngẫu nhiên).
- Sai số tuyệt đối ΔA = |A − Ā| (Ā: giá trị trung bình); sai số tỉ đối δA = (ΔA/Ā)·100%.
- Với đại lượng tính gián tiếp qua tích/thương, sai số tỉ đối của kết quả ≈ tổng sai số tỉ đối của các đại lượng thành phần.
- Ví dụ: đo đường kính viên bi 5 lần: 20,1mm; 20,3mm; 19,9mm; 20,2mm; 20,0mm → giá trị trung bình D̄=20,1mm; sai số tuyệt đối lớn nhất |ΔD|=0,2mm → ghi kết quả D=(20,1±0,2)mm.

[2. ĐỘNG HỌC CHẤT ĐIỂM]
- Thẳng đều: x = x0 + vt.
- Thẳng biến đổi đều: v = v0 + at ; x = x0 + v0t + ½at² ; v² − v0² = 2a·Δx.
- Rơi tự do: bỏ qua sức cản không khí, a = g (≈9,8 m/s²), v = gt, h = ½gt².
- Ném ngang / ném xiên: tách chuyển động thành 2 phương độc lập — phương ngang chuyển động đều, phương đứng là rơi tự do (ném ngang) hoặc biến đổi đều chịu gia tốc g (ném xiên).
- Lỗi thường gặp: nhầm tốc độ trung bình (quãng đường/thời gian) với độ lớn vận tốc trung bình (độ dịch chuyển/thời gian); quên đổi dấu gia tốc khi vật chuyển động chậm dần đều.
- Ví dụ: xe có v0=10 m/s, a=2 m/s², sau t=5s: v=v0+at=10+2×5=20 m/s; s=v0t+½at²=10×5+½×2×25=50+25=75m.
- Ví dụ rơi tự do: thả vật từ độ cao h=45m (lấy g=10 m/s² cho dễ tính, đề bài thường ghi rõ giá trị g cần dùng): t=√(2h/g)=√(90/10)=3s; v=gt=30 m/s.

[3. ĐỘNG LỰC HỌC]
- ĐL 1 Newton: vật giữ nguyên trạng thái đứng yên/chuyển động thẳng đều nếu hợp lực = 0.
- ĐL 2 Newton: F = m·a (dạng vector); khi giải phải liệt kê đủ lực (trọng lực, phản lực pháp tuyến N, lực căng dây T, lực ma sát Fms, lực kéo...), chọn hệ trục, chiếu lên từng phương.
- ĐL 3 Newton: lực và phản lực cùng độ lớn, ngược chiều, khác giá đặt (tác dụng lên 2 vật khác nhau — không triệt tiêu nhau).
- Trọng lực P = mg; lực ma sát trượt Fms = μN; lực đàn hồi (định luật Hooke) F = k|Δl|.
- Chuyển động tròn đều: lực hướng tâm KHÔNG phải loại lực mới, mà là hợp lực gây ra gia tốc hướng tâm: Fht = mv²/r = mω²r.
- Cân bằng vật rắn: điều kiện ΣF = 0 và ΣM = 0 (quy tắc momen); momen lực M = F·d (d = cánh tay đòn — khoảng cách vuông góc từ trục quay đến giá của lực).
- Ngẫu lực: 2 lực song song, ngược chiều, cùng độ lớn, không cùng giá — tổng hợp lực = 0 nhưng vẫn gây momen quay M = F·d (d: khoảng cách 2 giá).
- Quy tắc hợp lực song song cùng chiều: F = F1+F2, điểm đặt chia trong theo tỉ lệ nghịch F1·d1 = F2·d2.
- Mức vững vàng của vật có mặt chân đế: vật càng khó lật đổ khi trọng tâm càng thấp và mặt chân đế càng rộng (giá của trọng lực còn nằm trong mặt chân đế thì vật còn cân bằng).
- Lỗi thường gặp: quên lực ma sát nghỉ khi vật đứng yên; nhầm lực hướng tâm là một lực "thêm vào" thay vì hợp lực; nhầm ngẫu lực với 2 lực cân bằng thông thường.
- Ví dụ ĐL2: vật m=2kg trên sàn ngang, kéo lực F=6N song song mặt sàn, μ=0,2, g=10 m/s² → Fms=μmg=0,2×2×10=4N; hợp lực theo phương ngang = F−Fms=2N → a=F(hợp)/m=1 m/s².
- Ví dụ momen lực: thanh AB dài 2m, trục quay tại A, treo vật P=20N tại đầu B; giữ thanh cân bằng bằng lực F vuông góc thanh, đặt cách A 1,5m: cân bằng momen quanh A → F×1,5 = P×2 → F=40/1,5≈26,7N.

[4. LỰC HẤP DẪN]
- Định luật vạn vật hấp dẫn: Fhd = G·m1·m2/r² (G ≈ 6,67×10⁻¹¹ N·m²/kg²).
- Gia tốc trọng trường ở độ cao h: g(h) = G·M/(R+h)² (giảm dần khi lên cao, R: bán kính Trái Đất).
- Vệ tinh địa tĩnh/chuyển động tròn quanh Trái Đất: lực hấp dẫn đóng vai trò lực hướng tâm → G·M·m/r² = m·v²/r, suy ra tốc độ vũ trụ cấp 1 v = √(GM/r).
- Ví dụ: ở gần mặt đất (r≈R), do GM=gR² nên v1=√(gR); với g≈9,8 m/s², R≈6,4×10⁶m → v1=√(9,8×6,4×10⁶)≈√(6,27×10⁷)≈7,9×10³ m/s = 7,9 km/s — đúng bằng giá trị tốc độ vũ trụ cấp 1 nổi tiếng dùng để phóng vệ tinh tầm thấp.

[5. CÔNG — NĂNG LƯỢNG — CÔNG SUẤT]
- Công A = F·s·cosα (α là góc giữa F và hướng dịch chuyển).
- Động năng Wđ = ½mv²; định lý động năng: Wđ2 − Wđ1 = Angoại lực.
- Thế năng trọng trường Wt = mgh (mốc thế năng tự chọn); thế năng đàn hồi Wt = ½k(Δl)².
- Bảo toàn cơ năng khi KHÔNG có ma sát/lực cản: W = Wđ + Wt = hằng số. Nếu có ma sát, độ giảm cơ năng = công của lực ma sát (độ lớn).
- Công suất P = A/t = F·v·cosα.
- Ví dụ: vật m=1kg trượt không ma sát từ đỉnh mặt phẳng nghiêng cao h=5m. Bảo toàn cơ năng: mgh=½mv² → v=√(2gh)=√(2×10×5)=10 m/s tại chân dốc.

[6. ĐỘNG LƯỢNG]
- p = m·v (đại lượng vector, cùng hướng với v).
- Bảo toàn động lượng cho hệ kín: Σp(trước) = Σp(sau).
- Va chạm đàn hồi: bảo toàn cả động lượng và động năng. Va chạm mềm (hoàn toàn không đàn hồi): 2 vật dính vào nhau sau va chạm, chỉ bảo toàn động lượng, động năng bị mất mát (chuyển hóa thành nhiệt/biến dạng).
- Ví dụ va chạm mềm: xe A m1=1000kg chạy v1=10 m/s, va chạm và dính vào xe B m2=1500kg đang đứng yên → bảo toàn động lượng: m1v1=(m1+m2)v → v=10000/2500=4 m/s.

[7. CHUYỂN ĐỘNG TRÒN ĐỀU]
- Tốc độ góc ω = Δφ/Δt = v/r; chu kỳ T = 2π/ω; tần số f = 1/T.
- Gia tốc hướng tâm a = v²/r = ω²r (luôn hướng vào tâm, đặc trưng cho sự đổi hướng vận tốc dù tốc độ không đổi).
- Ví dụ: đĩa quay đều chu kỳ T=2s, điểm trên vành đĩa cách tâm r=0,1m → ω=2π/T≈3,14 rad/s; v=ωr≈0,314 m/s; a=ω²r≈0,987 m/s².

[8. BIẾN DẠNG CỦA VẬT RẮN. ÁP SUẤT CHẤT LỎNG]
- Biến dạng cơ của vật rắn: trong giới hạn đàn hồi tuân theo định luật Hooke F = k·Δl; ứng suất σ = F/S.
- Áp suất chất lỏng: p = p0 + ρ·g·h (h: độ sâu tính từ mặt thoáng); nguyên lý Pascal: áp suất tác dụng lên chất lỏng kín truyền nguyên vẹn đi mọi hướng — cơ sở của máy dùng chất lỏng (VD kích thủy lực).
- Khối lượng riêng ρ = m/V.
- Ví dụ: thanh thép tiết diện S=2cm²=2×10⁻⁴m², chịu lực kéo F=4000N → ứng suất σ=F/S=4000/(2×10⁻⁴)=2×10⁷ Pa.

============ LỚP 11 (Kết Nối Tri Thức) ============

[9. DAO ĐỘNG ĐIỀU HÒA]
- Phương trình li độ: x = A·cos(ωt + φ); vận tốc v = −Aω·sin(ωt+φ); gia tốc a = −ω²x (luôn hướng về vị trí cân bằng — đây là dấu hiệu nhận biết dao động điều hòa).
- Chu kỳ T = 2π/ω, tần số f = 1/T. Biên độ A và pha ban đầu φ do điều kiện ban đầu (kéo dãn bao nhiêu, thả lúc nào) quyết định — KHÔNG ảnh hưởng đến T.
- Con lắc lò xo: T = 2π√(m/k) — chỉ phụ thuộc m, k, không phụ thuộc A.
- Con lắc đơn: T = 2π√(l/g) — CHỈ đúng khi góc lệch nhỏ (α0 ≤ 10°, xấp xỉ sin α ≈ α); phải nhắc học sinh điều kiện này nếu bài cho góc lệch lớn.
- Năng lượng dao động: W = ½kA² = ½mω²A² = hằng số (nếu không có ma sát) — động năng và thế năng biến đổi qua lại nhưng tổng không đổi.
- Dao động tắt dần: biên độ giảm dần theo thời gian do ma sát/lực cản. Dao động cưỡng bức: hệ dao động dưới tác dụng ngoại lực tuần hoàn, biên độ ổn định phụ thuộc tần số ngoại lực. Cộng hưởng: biên độ đạt cực đại khi tần số ngoại lực = tần số dao động riêng của hệ.
- Ví dụ: con lắc lò xo m=0,1kg, k=10N/m → T=2π√(m/k)=2π√(0,01)=2π×0,1≈0,628s (dùng công cụ đạo hàm ở mục C để hiểu vì sao v, a suy được trực tiếp từ x).

[10. SÓNG]
- Phương trình sóng tại một điểm: u = A·cos(ωt − 2πx/λ).
- Liên hệ: λ = v·T = v/f (λ: bước sóng, v: tốc độ truyền sóng — v phụ thuộc môi trường, KHÔNG phụ thuộc nguồn phát).
- Giao thoa sóng (2 nguồn kết hợp, cùng pha): cực đại giao thoa khi d2 − d1 = k·λ; cực tiểu khi d2 − d1 = (k+0,5)·λ.
- Sóng dừng: 2 đầu cố định → l = k·λ/2 (k bó sóng); một đầu cố định một đầu tự do → l = (2k+1)·λ/4.
- Sóng âm: mức cường độ âm L(dB) = 10·log(I/I0), với I0 = 10⁻¹² W/m² là cường độ âm chuẩn.
- Sóng điện từ được giới thiệu ở mức khái niệm tại đây (sóng ngang, lan truyền không cần môi trường); phần liên hệ với hiện tượng cảm ứng điện từ được học sâu hơn ở lớp 12 (mục 14).
- Ví dụ giao thoa: 2 nguồn kết hợp cùng pha, bước sóng λ=50cm; điểm M có d1=20cm, d2=45cm → d2−d1=25cm=0,5λ → M là điểm cực tiểu giao thoa (vì d2−d1=(k+0,5)λ với k=0).

[11. ĐIỆN TRƯỜNG]
- Định luật Coulomb: F = k·|q1·q2|/(ε·r²), k ≈ 9×10⁹ N·m²/C².
- Cường độ điện trường của điện tích điểm: E = k·|Q|/(ε·r²); lực điện F = q·E.
- Điện thế V; hiệu điện thế U = V1 − V2; công của lực điện A = q·U (không phụ thuộc hình dạng đường đi, chỉ phụ thuộc điểm đầu-cuối).
- Tụ điện: điện dung C = Q/U; năng lượng điện trường trong tụ W = ½CU² = ½QU = Q²/(2C).
- Ghép tụ nối tiếp: 1/C = 1/C1 + 1/C2 + ...; ghép song song: C = C1 + C2 + ...
- Ví dụ: điện tích điểm Q=10⁻⁸C trong chân không, tính E tại điểm cách 10cm: E=k·Q/r²=9×10⁹×10⁻⁸/(0,1)²=90/0,01=9×10³ V/m.

[12. DÒNG ĐIỆN. MẠCH ĐIỆN]
- Định luật Ôm cho toàn mạch: I = E/(R + r) (E: suất điện động nguồn, r: điện trở trong).
- Ghép nguồn nối tiếp: Eb = E1+E2+...; rb = r1+r2+... Ghép song song (các nguồn giống nhau): Eb = E; rb = r/n.
- Công suất nguồn Pnguồn = E·I; công suất tiêu thụ mạch ngoài P = I²R; hiệu suất nguồn H = U/E = Rngoài/(Rngoài+r).
- Mạch điện trở: nối tiếp → I chung, Rtđ = R1+R2+...; song song → U chung, 1/Rtđ = 1/R1+1/R2+...
- Ví dụ: nguồn E=12V, r=1Ω, mạch ngoài R=5Ω → I=E/(R+r)=12/6=2A; U(ngoài)=IR=10V; hiệu suất H=U/E=10/12≈83,3%.

============ LỚP 12 (Kết Nối Tri Thức) ============

[13. VẬT LÍ NHIỆT VÀ CHẤT KHÍ]
- Mô hình động học phân tử: vật chất cấu tạo từ phân tử chuyển động không ngừng; nhiệt độ càng cao, phân tử chuyển động càng nhanh — dùng mô hình này để giải thích cấu trúc rắn/lỏng/khí và sự chuyển thể (nóng chảy, hóa hơi...).
- Thang nhiệt độ: T(K) = t(°C) + 273.
- Nội năng và nhiệt lượng: Q = m·c·Δt (c: nhiệt dung riêng); nhiệt nóng chảy riêng Q=λm, nhiệt hóa hơi riêng Q=Lm.
- Định luật I nhiệt động lực học: ΔU = A + Q (quy ước dấu theo chiều trao đổi năng lượng với hệ — hệ nhận công/nhiệt thì A, Q > 0).
- Các định luật chất khí lý tưởng: Boyle (đẳng nhiệt: p·V = const), Charles (đẳng tích: p/T = const); phương trình trạng thái khí lí tưởng: p·V/T = const.
- Áp suất khí theo mô hình động học phân tử: áp suất và nhiệt độ đều liên hệ trực tiếp với động năng trung bình của phân tử khí — nhiệt độ tăng thì động năng phân tử tăng, va chạm vào thành bình mạnh hơn, áp suất tăng.
- Ví dụ: đun m=2kg nước từ 20°C lên 100°C (Δt=80°C), nhiệt dung riêng nước c=4200 J/(kg·K) → Q=mcΔt=2×4200×80=672000J=672kJ.
- Ví dụ định luật Boyle: khối khí ở áp suất p1=1atm, thể tích V1=4 lít, nén đẳng nhiệt còn V2=2 lít → p2=p1V1/V2=1×4/2=2atm.

[14. TỪ TRƯỜNG]
- Từ trường xuất hiện quanh nam châm và quanh dòng điện; biểu hiện qua lực từ tác dụng lên dòng điện/nam châm khác đặt trong nó.
- Cảm ứng từ do dòng điện thẳng dài gây ra tại điểm cách dây khoảng r: B = 2×10⁻⁷·I/r. Cảm ứng từ tại tâm dòng điện tròn bán kính R: B = 2π×10⁻⁷·I/R. Cảm ứng từ trong lòng ống dây (solenoid): B = 4π×10⁻⁷·n·I (n: số vòng dây trên 1 mét chiều dài). Quy tắc nắm tay phải dùng để xác định chiều đường sức từ.
- Lực từ (lực Ampère) tác dụng lên dây dẫn mang dòng điện trong từ trường đều: F = B·I·l·sinα (α là góc giữa dây dẫn và B).
- Lực Lorentz tác dụng lên hạt điện tích chuyển động: f = |q|·v·B·sinα; dùng quy tắc bàn tay trái để xác định chiều.
- Từ thông qua khung dây: Φ = B·S·cosα. Định luật Faraday: suất điện động cảm ứng |ec| = |ΔΦ/Δt|. Định luật Lenz: chiều dòng điện cảm ứng luôn chống lại sự biến thiên từ thông sinh ra nó.
- Máy phát điện xoay chiều: dựa trên hiện tượng cảm ứng điện từ — khung dây quay đều trong từ trường tạo ra suất điện động biến thiên điều hòa theo thời gian; đây là ứng dụng thực tiễn chính của cảm ứng điện từ ở chương trình hiện hành, KHÔNG cần đi sâu phân tích mạch RLC như chương trình cũ.
- Điện từ trường và mô hình sóng điện từ: điện trường biến thiên sinh ra từ trường biến thiên và ngược lại — đây là cơ sở của sóng điện từ (đã giới thiệu khái niệm ở lớp 11, mục 10), lan truyền được trong chân không với tốc độ c ≈ 3×10⁸ m/s.
- Ví dụ lực từ: dây dẫn dài l=0,5m mang dòng I=4A đặt vuông góc từ trường đều B=0,2T → F=BIl=0,2×4×0,5=0,4N.
- Ví dụ cảm ứng: khung dây diện tích S=0,02m² đặt vuông góc từ trường B giảm đều từ 0,5T về 0 trong Δt=0,1s → |ec|=ΔΦ/Δt=(B·S)/Δt=(0,5×0,02)/0,1=0,1V.

[15. VẬT LÍ HẠT NHÂN]
- Cấu tạo hạt nhân: kí hiệu A/Z X, với A = Z + N (A: số khối, Z: số proton, N: số neutron).
- Độ hụt khối Δm = (Z·mp + N·mn) − mhạt nhân; năng lượng liên kết Wlk = Δm·c² (càng lớn, hạt nhân càng bền vững — nên so sánh năng lượng liên kết RIÊNG Wlk/A để đánh giá độ bền).
- Phóng xạ: định luật phóng xạ N = N0·2^(−t/T) (T: chu kỳ bán rã, đặc trưng cho từng chất, không đổi theo điều kiện bên ngoài); 3 loại tia phóng xạ chính: α (hạt nhân He), β (electron/positron), γ (sóng điện từ năng lượng cao).
- Phản ứng hạt nhân: luôn bảo toàn số khối A, bảo toàn điện tích Z, bảo toàn động lượng, bảo toàn năng lượng toàn phần (kể cả năng lượng nghỉ).
- Công nghiệp hạt nhân: ứng dụng phản ứng hạt nhân trong sản xuất điện (nhà máy điện hạt nhân), y học (chẩn đoán, xạ trị), nông nghiệp... đi kèm yêu cầu kiểm soát an toàn phóng xạ.
- Ví dụ phóng xạ: chất có chu kỳ bán rã T=8 ngày, ban đầu có N0 hạt nhân, sau t=24 ngày (=3T) → N=N0·2^(−3)=N0/8 — còn lại 1/8 số hạt nhân ban đầu.

============ NGOÀI CHƯƠNG TRÌNH VẬT LÍ THPT HIỆN HÀNH (Kết Nối Tri Thức) ============
(Các chuyên đề dưới đây KHÔNG thuộc chương trình chính khóa Vật lí lớp 10-11-12 theo sách Kết Nối Tri Thức hiện hành — do đã chuyển xuống THCS, được rút gọn/gộp vào chuyên đề khác, hoặc không còn là nội dung bắt buộc. CHỈ dùng phần này nếu học sinh chủ động hỏi ôn lại kiến thức cũ, hỏi mở rộng, hoặc hỏi vì mục đích thi cử có phạm vi kiến thức rộng hơn sách giáo khoa — và khi dùng, hãy nói rõ với học sinh đây là kiến thức ngoài chương trình THPT hiện hành của các em, không phải nội dung sẽ kiểm tra theo sách đang học.)

[QUANG HÌNH HỌC — THẤU KÍNH (đã học ở lớp 9, không còn ở chương trình THPT)]
- Khúc xạ ánh sáng: n1·sin i = n2·sin r. Thấu kính mỏng: 1/f = 1/d + 1/d'; độ phóng đại k = −d'/d.
- Nếu học sinh THPT hỏi lại phần này, nhiều khả năng các em đang ôn lại kiến thức lớp 9 hoặc luyện thi có phạm vi mở rộng — hãy xác nhận lại mục đích trước khi đi sâu.

[DÒNG ĐIỆN TRONG CÁC MÔI TRƯỜNG (chương trình cũ trước 2018, không có trong 4 chương lớp 11 KNTT hiện hành)]
- Kim loại: điện trở suất tăng theo nhiệt độ ρ = ρ0(1+α·Δt). Chất điện phân: định luật Faraday m = (A/n)·I·t/F. Bán dẫn: loại n/p, lớp chuyển tiếp p-n có tính chỉnh lưu (diode); transistor khuếch đại tín hiệu.

[PHÂN TÍCH CHI TIẾT MẠCH ĐIỆN XOAY CHIỀU RLC VÀ MẠCH DAO ĐỘNG LC (chương trình cũ, chương trình hiện hành chỉ học khái niệm máy phát điện xoay chiều ở mức nhẹ — mục 14)]
- Mạch dao động LC: q = Q0·cos(ωt+φ), ω=1/√(LC); năng lượng W=Q0²/(2C)=const.
- Mạch RLC nối tiếp: ZL=ωL; ZC=1/(ωC); Z=√(R²+(ZL−ZC)²); cộng hưởng khi ZL=ZC. Máy biến áp lý tưởng: U1/U2 = N1/N2.

  function sleep(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }

  // Gọi fetch với thử lại tự động: thử lại khi lỗi mạng tạm thời hoặc gặp 429 (quá giới hạn request)
  async function fetchWithRetry(url, options, maxRetries){
    maxRetries = (maxRetries === undefined) ? 2 : maxRetries;
    const TIMEOUT_MS = 30000; // 30s mỗi lần thử — quá thời gian này coi như treo, huỷ và thử lại/báo lỗi thay vì chờ vô thời hạn
    let lastErr;
    for(let attempt = 0; attempt <= maxRetries; attempt++){
      const controller = new AbortController();
      const timer = setTimeout(()=>controller.abort(), TIMEOUT_MS);
      try{
        const res = await fetch(url, Object.assign({}, options, { signal: controller.signal }));
        clearTimeout(timer);
        if(res.status === 429 && attempt < maxRetries){
          await sleep(1000 * Math.pow(2, attempt)); // 1s, rồi 2s
          continue;
        }
        return res;
      }catch(err){
        clearTimeout(timer);
        lastErr = (err && err.name === 'AbortError') ? new Error('Yêu cầu mất quá ' + (TIMEOUT_MS/1000) + 's không có phản hồi (có thể do ảnh quá nặng hoặc mạng chậm).') : err;
        if(attempt < maxRetries){
          await sleep(700 * (attempt + 1));
          continue;
        }
      }
    }
    throw lastErr || new Error('Lỗi mạng sau nhiều lần thử lại');
  }

      return data.candidates[0].content.parts.map(p=>p.text||'').join('');

    if(data && data.error){
      return '[CORE]\nGemini báo lỗi: ' + (data.error.message || JSON.stringify(data.error));
    }
    return '';
  }

  async function askGeminiOAuth(messages){
    if(!googleAccessToken){
      return '[CORE]\nBạn chưa đăng nhập Google. Hãy bấm nút "Đăng nhập Google" ở góc trên rồi thử lại.';
    }
    const contents = buildGeminiContents(getContextWindow(messages));
    const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + AI_CONFIG.geminiModel + ':generateContent';
    const headers = {
      'Content-Type':'application/json',
      'Authorization': 'Bearer ' + googleAccessToken
    };
    if(AI_CONFIG.googleCloudProjectId){
      headers['x-goog-user-project'] = AI_CONFIG.googleCloudProjectId;
    }
    const response = await fetchWithRetry(url, {
      method:'POST',
      headers: headers,
      body: JSON.stringify({
        contents: contents,
        system_instruction: { parts: [{ text: SYSTEM_PROMPT }] }
      })
    });
    const data = await response.json();
    if(data && data.candidates && data.candidates[0] && data.candidates[0].content){
      return data.candidates[0].content.parts.map(p=>p.text||'').join('');
    }
    if(data && data.error){
      if(data.error.code === 401){
        googleAccessToken = null; // token hết hạn/không hợp lệ, cần đăng nhập lại
        return '[CORE]\nPhiên đăng nhập Google đã hết hạn. Hãy bấm "Đăng nhập Google" lại rồi thử gửi câu hỏi lần nữa.';
      }
      return '[CORE]\nGemini báo lỗi: ' + (data.error.message || JSON.stringify(data.error));
    }
    return '';
  }

  async function askDeepSeek(messages){
    if(!AI_CONFIG.deepseekProxyUrl){
      return '[CORE]\nChưa cấu hình proxy cho DeepSeek. Hãy dán URL Cloudflare Worker vào AI_CONFIG.deepseekProxyUrl trong code.';
    }
    const windowed = getContextWindow(messages);
    const hasImage = windowed.some(m=>m.image);
    const systemText = SYSTEM_PROMPT + (hasImage ? '\n\n(Lưu ý: học sinh vừa gửi kèm 1 ảnh, nhưng DeepSeek trong bản này chưa hỗ trợ xem ảnh — hãy yêu cầu học sinh mô tả lại nội dung ảnh bằng chữ.)' : '');
    const apiMessages = [
      { role: 'system', content: systemText },
      ...windowed.map(m=>({role:m.role, content:m.content}))
    ];
    const response = await fetchWithRetry(AI_CONFIG.deepseekProxyUrl, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model: 'deepseek-v4-flash',
        messages: apiMessages
      })
    });
    const data = await response.json();
    if(data && data.choices && data.choices[0] && data.choices[0].message){
      return data.choices[0].message.content || '';
    }
    if(data && data.error){
      return '[CORE]\nDeepSeek báo lỗi: ' + (data.error.message || JSON.stringify(data.error));
    }
    return '';
  }

  // Nhập mã số -> kiểm tra trùng -> nếu chưa ai dùng thì tạo luôn và vào phòng học (không cần PIN)
  async function handleCodeContinue(){
    const val = document.getElementById('codeInput').value.trim().toUpperCase();
    if(!val){ return; }
    state.loginError = null;
    state.joining = true;
    render();
    let exists = false;
    try{
      const res = await AppStorage.get('student:' + val, true);
      exists = !!(res && res.value);
    }catch(e){ exists = false; }

    if(exists){
      // Mã này đã có người dùng — có thể là chính chủ quay lại học tiếp, cũng có thể là người
      // khác gõ trùng. Hỏi xác nhận một câu thay vì chặn cứng, để không khoá luôn người quay lại.
      const isMine = confirm(
        'Mã "' + val + '" đã được dùng trước đó.\n\n' +
        'Bấm OK nếu ĐÂY LÀ MÃ CỦA BẠN và bạn muốn tiếp tục buổi học cũ.\n' +
        'Bấm Hủy nếu bạn đang chọn mã lần đầu và mã này không phải của bạn (chọn mã khác).'
      );
      state.joining = false;
      if(isMine){
        enterChatRoom(val);
      } else {
        state.loginError = 'Được, hãy nhập một mã số khác chưa ai dùng nhé.';
        render();
      }
      return;
    }

    try{
      await AppStorage.set('student:' + val, JSON.stringify({ createdAt: Date.now() }), true);
    }catch(e){
      state.loginError = 'Không tạo được mã số, thử lại nhé.';
      state.joining = false;
      render();
      return;
    }
    state.joining = false;
    enterChatRoom(val);
  }

  // Đọc lại dữ liệu mới nhất trước khi ghi và GỘP (thay vì ghi đè), để giảm rủi ro mất dữ liệu
  // nếu học sinh mở cùng lúc nhiều tab/thiết bị (last-write-wins).
  async function saveHistory(){
    try{
      let latest = [];
      try{
        const res = await AppStorage.get('log:' + state.code, true);
        if(res && res.value) latest = JSON.parse(res.value);
      }catch(e){ /* chưa có dữ liệu cũ, coi như rỗng */ }

      const existingTs = new Set(latest.map(m=>m.ts));
      const newOnes = state.messages
        .filter(m=>!existingTs.has(m.ts))
        .map(m=>({
          role: m.role,
          content: m.image ? (m.content + ' [đã đính kèm 1 ảnh]') : m.content,
          ts: m.ts
        }));
      const merged = [...latest, ...newOnes].sort((a,b)=>a.ts-b.ts);

      const result = await AppStorage.set('log:' + state.code, JSON.stringify(merged), true);
      if(!result){
        console.error('Storage operation failed');
      }
    }catch(e){
      console.error('Không lưu được lịch sử:', e);
    }
  }

  function handleImageSelect(e){
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 4*1024*1024){
      alert('Ảnh quá lớn (trên 4MB) — chọn ảnh khác hoặc chụp lại với độ phân giải thấp hơn nhé.');
      return;
    }
    const reader = new FileReader();
    reader.onload = ()=>{
      const dataUrl = String(reader.result || '');
      downscaleImage(dataUrl, 1600).then(smallerDataUrl=>{
        const match = smallerDataUrl.match(/^data:(.*?);base64,(.*)$/);
        if(!match){ alert('Không đọc được ảnh này, thử ảnh khác nhé.'); return; }
        state.pendingImage = { mimeType: match[1], base64: match[2] };
        renderChat();
      }).catch(()=>{
        // Co ảnh thất bại (hiếm gặp) -> vẫn dùng ảnh gốc thay vì chặn học sinh hoàn toàn
        const match = dataUrl.match(/^data:(.*?);base64,(.*)$/);
        if(match){ state.pendingImage = { mimeType: match[1], base64: match[2] }; renderChat(); }
        else { alert('Không đọc được ảnh này, thử ảnh khác nhé.'); }
      });
    };
    reader.onerror = ()=>{ alert('Không đọc được ảnh này, thử ảnh khác nhé.'); };
    reader.readAsDataURL(file);
  }

  // Co ảnh về tối đa maxDim (chiều dài nhất) và nén lại thành JPEG chất lượng 0.82 —
  // ảnh chụp đề bài không cần độ phân giải gốc, co lại giúp gửi nhanh hơn nhiều, đỡ treo máy chậm/mạng yếu.
  function downscaleImage(dataUrl, maxDim){
    return new Promise((resolve, reject)=>{
      let settled = false;
      const safetyTimer = setTimeout(()=>{
        if(!settled){ settled = true; reject(new Error('Ảnh load quá lâu, dùng ảnh gốc.')); }
      }, 8000); // phòng hờ: nếu ảnh không load được để co nhỏ trong 8s, dùng ảnh gốc thay vì treo
      const img = new Image();
      img.onload = ()=>{
        if(settled) return;
        settled = true;
        clearTimeout(safetyTimer);
        let { width, height } = img;
        if(width <= maxDim && height <= maxDim){ resolve(dataUrl); return; } // ảnh đã đủ nhỏ, khỏi nén lại mất chi tiết
        const scale = maxDim / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = ()=>{
        if(settled) return;
        settled = true;
        clearTimeout(safetyTimer);
        reject(new Error('Không đọc được ảnh để co nhỏ.'));
      };
      img.src = dataUrl;
    });
  }

  function renderMessages(){
    const box = document.getElementById('messages');
    if(!box) return;
    let html = '';
    if(state.messages.length === 0){
      html += `<div class="msg system-note">Hãy bắt đầu bằng việc mô tả bạn đang làm bài gì và đang vướng ở đâu (Bước Critique). Đừng hỏi thẳng đáp số nhé!</div>`;
    }
    for(const m of state.messages){
      if(m.role === 'user'){
        const imgTag = m.image ? '<div style="font-size:11px;opacity:.8;margin-bottom:4px;">🖼️ Đã gửi kèm ảnh</div>' : '';
        html += `<div class="msg user">${imgTag}${formatMessageBody(m.content)}</div>`;
      } else {
        const tagMatch = m.content.match(/^\[(CRITIQUE|CORE|CONSOLIDATE)\]/i);
        const tag = tagMatch ? `<span class="step-tag">${tagMatch[1].toUpperCase()}</span><br/>` : '';
        const body = tagMatch ? m.content.replace(tagMatch[0],'').trim() : m.content;
        html += `<div class="msg assistant">${tag}${formatMessageBody(body)}</div>`;
      }
    }
    if(state.sending){
      html += `<div class="typing">AI đang gợi ý...</div>`;
    }
    box.innerHTML = html;
    box.scrollTop = box.scrollHeight;
    renderMathIn(box);
  }

  // Dò và hiển thị công thức Toán (KaTeX) trong một vùng DOM vừa được cập nhật.
  // Chấp nhận các dấu phân cách: \( \), \[ \], $...$, $$...$$
  function renderMathIn(el){
    if(!el || typeof renderMathInElement !== 'function') return;
    try{
      renderMathInElement(el, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '\\[', right: '\\]', display: true },
          { left: '\\(', right: '\\)', display: false }
        ],
        throwOnError: false
      });
    }catch(e){ /* nếu KaTeX chưa load kịp, im lặng bỏ qua — văn bản vẫn hiển thị bình thường */ }
  }

  async function handleSend(){
    const ta = document.getElementById('input');
    const text = ta.value.trim();
    const image = state.pendingImage;
    if(!text && !image) return;
    if(state.sending) return;
    ta.value = '';

    const userMsg = { role:'user', content: text || '(đã gửi ảnh đề bài, không kèm mô tả)', ts: Date.now() };
    if(image) userMsg.image = image;
    state.messages.push(userMsg);
    state.pendingImage = null;
    state.sending = true;
    renderChat();

    try{
      let replyText = await askAI(state.messages);
      if(!replyText){ replyText = '[CORE]\nXin lỗi, mình chưa nhận được phản hồi rõ ràng. Bạn thử mô tả lại chỗ đang vướng nhé?'; }
      state.messages.push({role:'assistant', content:replyText, ts:Date.now()});
    }catch(e){
      state.messages.push({role:'assistant', content:'[CORE]\nCó lỗi kết nối dù đã thử lại vài lần. Kiểm tra mạng rồi gửi lại câu hỏi nhé.', ts:Date.now()});
    }
    state.sending = false;
    renderChat();
    saveHistory();
  }

    `;
    document.getElementById('researcherAuthBtn').onclick = checkResearcherPassword;
    document.getElementById('researcherPwInput').addEventListener('keydown', e=>{ if(e.key==='Enter') checkResearcherPassword(); });
    document.getElementById('backFromGateBtn').onclick = ()=>{ state.screen='login'; state.loginError=null; render(); };
  }

  function checkResearcherPassword(){
    const val = document.getElementById('researcherPwInput').value;
    if(val === AI_CONFIG.researcherPassword){
      state.researcherAuthed = true;
      state.loginError = null;
      state.screen = 'researcher';
      render();
      loadResearcherLogs();
    } else {
      state.loginError = 'Sai mật khẩu.';
      render();
    }
  }

  // ---------- Researcher view ----------
  async function researcherCreateCode(){
    const input = document.getElementById('newCodeInput');
    const val = input.value.trim().toUpperCase();
    if(!val){ return; }
    try{
      const res = await AppStorage.get('student:' + val, true);
      if(res && res.value){
        alert('Mã "' + val + '" đã tồn tại rồi — chọn mã khác nhé.');
        return;
      }
    }catch(e){ /* chưa tồn tại -> tạo mới bên dưới */ }
    try{
      await AppStorage.set('student:' + val, JSON.stringify({ createdAt: Date.now(), createdByResearcher: true }), true);
      alert('Đã tạo mã "' + val + '". Học sinh chỉ cần vào trang, nhập đúng mã này ở màn hình đăng nhập là dùng được luôn (mã sẽ hiện trong danh sách log sau khi học sinh bắt đầu trò chuyện).');
      input.value = '';
    }catch(e){
      alert('Không tạo được mã, thử lại nhé.');
    }
  }

  async function loadResearcherLogs(){
    try{
      const listRes = await AppStorage.list('log:', true);
      const keys = (listRes && listRes.keys) || [];
      const logs = [];
      for(const k of keys){
        try{
          const r = await AppStorage.get(k, true);
          if(r && r.value){
            const code = k.replace('log:','');
            let note = { coder1:'', coder2:'' };
            try{
              const noteRes = await AppStorage.get('note:' + code, true);
              if(noteRes && noteRes.value) note = JSON.parse(noteRes.value);
            }catch(e){ /* chưa có ghi chú, dùng mặc định */ }
            logs.push({ key:k, code, messages: JSON.parse(r.value), note });
          }
        }catch(e){}
      }
      logs.sort((a,b)=> a.code.localeCompare(b.code));
      state.researcherLogs = logs;
    }catch(e){
      state.researcherLogs = [];
    }
    renderResearcher();
  }

  function filterMessagesByDate(messages){
    if(!state.dateFrom && !state.dateTo) return messages;
    const fromTs = state.dateFrom ? new Date(state.dateFrom + 'T00:00:00').getTime() : -Infinity;
    const toTs = state.dateTo ? new Date(state.dateTo + 'T23:59:59').getTime() : Infinity;
    return messages.filter(m => m.ts >= fromTs && m.ts <= toTs);
  }

  function renderResearcher(){
    root.innerHTML = `
      <div class="topbar">
        <div class="brand">Nhật ký hội thoại · Nhóm nghiên cứu<small>Phân loại Critique – Core – Consolidate</small></div>
        <div class="actions">
          <button class="pillbtn" id="backBtn">← Quay lại</button>
        </div>
      </div>
      <div class="researcher">
        <div class="warn">Dữ liệu ở đây dùng chung (shared storage) và đã được khóa bằng mật khẩu ở bước trước — vẫn lưu ý không dùng tên thật, chỉ dùng mã số, để đảm bảo ẩn danh theo mục 3.3.4.</div>
        <div class="toolbar">
          <button class="smallbtn" id="refreshBtn">Tải lại danh sách</button>
          <button class="smallbtn secondary" id="exportBtn">Tải dữ liệu đang lọc (JSON)</button>
          <div class="date-filter">
            <input id="newCodeInput" placeholder="Tạo trước mã, VD: TN05" autocomplete="off" style="width:150px;" />
            <button class="smallbtn" id="createCodeBtn">+ Tạo mã số</button>
          </div>
          <div class="date-filter">
            Từ ngày <input type="date" id="dateFromInput" value="${state.dateFrom}" />
            đến <input type="date" id="dateToInput" value="${state.dateTo}" />
            <button class="smallbtn secondary" id="applyFilterBtn">Lọc</button>
            <button class="smallbtn secondary" id="clearFilterBtn">Bỏ lọc</button>
          </div>
        </div>
        <div id="logList"></div>
      </div>
    `;
    document.getElementById('backBtn').onclick = ()=>{ state.screen='login'; render(); };
    document.getElementById('refreshBtn').onclick = loadResearcherLogs;
    document.getElementById('exportBtn').onclick = exportLogs;
    document.getElementById('createCodeBtn').onclick = researcherCreateCode;
    document.getElementById('newCodeInput').addEventListener('keydown', e=>{ if(e.key==='Enter') researcherCreateCode(); });
    document.getElementById('applyFilterBtn').onclick = ()=>{
      state.dateFrom = document.getElementById('dateFromInput').value;
      state.dateTo = document.getElementById('dateToInput').value;
      renderResearcher();
    };
    document.getElementById('clearFilterBtn').onclick = ()=>{
      state.dateFrom = ''; state.dateTo = '';
      renderResearcher();
    };

    const list = document.getElementById('logList');
    if(state.researcherLogs === null){
      list.innerHTML = `<div class="empty">Đang tải log...</div>`;
      return;
    }
    if(state.researcherLogs.length === 0){
      list.innerHTML = `<div class="empty">Chưa có log nào được ghi nhận.</div>`;
      return;
    }
    list.innerHTML = state.researcherLogs.map(log=>{
      const isOpen = state.openLogKey === log.key;
      const filtered = filterMessagesByDate(log.messages);
      const bodyHtml = filtered.map(m=>{
        const who = m.role==='user' ? 'Học sinh' : 'AI';
        const time = new Date(m.ts).toLocaleString('vi-VN');
        return `<div style="margin-bottom:8px;"><b style="font-size:12px;color:var(--navy);">${who}</b> <span style="font-size:10.5px;color:var(--navy-dim);">${time}</span><br/><span style="font-size:13px;">${formatMessageBody(m.content)}</span></div>`;
      }).join('');
      return `
        <div class="logrow">
          <div class="logrow-head" data-key="${escapeHtml(log.key)}">
            <b>Mã số: ${escapeHtml(log.code)}</b>
            <span>${filtered.length}/${log.messages.length} lượt thoại ${isOpen ? '▲' : '▼'}</span>
          </div>
          <div class="logrow-body ${isOpen?'open':''}">
            ${bodyHtml || '<span class="empty">Không có lượt thoại nào trong khoảng ngày đã lọc</span>'}
            <div class="note-box">
              <label>Ghi chú phân loại — Người phân loại 1</label>
              <textarea id="coder1_${escapeHtml(log.code)}" placeholder="VD: 8/10 đoạn đúng quy trình 3C...">${escapeHtml(log.note.coder1||'')}</textarea>
              <label>Ghi chú phân loại — Người phân loại 2</label>
              <textarea id="coder2_${escapeHtml(log.code)}" placeholder="Nhập độc lập, không xem trước ghi chú của người 1...">${escapeHtml(log.note.coder2||'')}</textarea>
              <div style="margin-top:8px;display:flex;gap:8px;">
                <button class="smallbtn" data-savecode="${escapeHtml(log.code)}">Lưu ghi chú</button>
                <button class="smallbtn danger" data-deletecode="${escapeHtml(log.code)}">🗑 Xoá log này (không phù hợp)</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }).join('');

    list.querySelectorAll('.logrow-head').forEach(el=>{
      el.onclick = ()=>{
        const key = el.getAttribute('data-key');
        state.openLogKey = state.openLogKey === key ? null : key;
        renderResearcher();
      };
    });
    list.querySelectorAll('[data-savecode]').forEach(btn=>{
      btn.onclick = (ev)=>{ ev.stopPropagation(); saveNote(btn.getAttribute('data-savecode')); };
    });
    list.querySelectorAll('[data-deletecode]').forEach(btn=>{
      btn.onclick = (ev)=>{ ev.stopPropagation(); deleteLog(btn.getAttribute('data-deletecode')); };
    });
    renderMathIn(list);
  }

  async function saveNote(code){
    const c1 = document.getElementById('coder1_' + code).value;
    const c2 = document.getElementById('coder2_' + code).value;
    try{
      await AppStorage.set('note:' + code, JSON.stringify({ coder1:c1, coder2:c2, updatedAt: Date.now() }), true);
      alert('Đã lưu ghi chú phân loại cho ' + code + '.');
    }catch(e){
      alert('Không lưu được ghi chú, thử lại nhé.');
    }
  }

  async function deleteLog(code){
    if(!confirm('Xoá VĨNH VIỄN toàn bộ hội thoại, ghi chú phân loại, và mã số "' + code + '"?\n\nDùng khi log không phù hợp (spam, test thử, ngoài phạm vi nghiên cứu...). Không thể hoàn tác.')) return;
    try{
      await AppStorage.delete('log:' + code, true);
      await AppStorage.delete('note:' + code, true);
      try{ await AppStorage.delete('student:' + code, true); }catch(e){ /* có thể đã không tồn tại, bỏ qua */ }
      state.openLogKey = null;
      alert('Đã xoá log của ' + code + '. Mã số này giờ có thể được dùng lại bởi người khác.');
      loadResearcherLogs();
    }catch(e){
      alert('Không xoá được, thử lại nhé.');
    }
  }

  function exportLogs(){
    if(!state.researcherLogs) return;
    const dataToExport = state.researcherLogs.map(log=>({
      code: log.code,
      messages: filterMessagesByDate(log.messages),
      note: log.note
    }));
    const blob = new Blob([JSON.stringify(dataToExport, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'log-hoi-thoai-3C.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // Escape HTML trước, rồi mới đổi **đậm** thành <b> — để tránh chèn HTML thật từ nội dung học sinh/AI gõ.
  // Ký hiệu Toán dạng \( \), \[ \], $...$ được GIỮ NGUYÊN qua bước này để KaTeX xử lý sau khi chèn vào DOM.
  function formatMessageBody(text){
    return escapeHtml(text).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  }

  function escapeHtml(str){
    return String(str)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  render();
})();
</script>

</body>
</html>
